apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-study
resources:
  - k8s/app.yaml
configMapGenerator:
  - name: home-study-code
    files:
      - app.py
      - anki_import.py
      - uploads.py
      - pdf_source.py
      - requirements.txt
      - wake.py
      - index.html
      - review.html
      - common.js
      - study.js
      - review.js
      - study.css
